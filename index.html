<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>US Helicopter Flash Cards v6</title><style>
:root{--bg:#0f172a;--panel:#111827;--panel2:#1f2937;--text:#f8fafc;--muted:#94a3b8;--border:#334155;--blue:#0369a1;--red:#991b1b;--green:#166534;--yellow:#92400e;--accent:#38bdf8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1e293b,var(--bg));color:var(--text);font-family:Arial,Helvetica,sans-serif;padding:14px}.app{max-width:980px;margin:auto}header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}h1{font-size:22px;margin:8px 0}.stats{display:flex;gap:6px;flex-wrap:wrap}.stats span{border:1px solid var(--border);border-radius:999px;padding:6px 10px;color:#cbd5e1;background:#0f172acc;font-size:13px}.card{background:#111827dd;border:1px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:0 20px 60px #0008;cursor:pointer;min-height:590px}.photo{height:455px;background:#020617;display:flex;align-items:center;justify-content:center;position:relative;color:var(--muted);text-align:center;padding:20px}.photo img{width:100%;height:100%;object-fit:contain;display:block}.spinner{width:58px;height:58px;border:6px solid rgba(255,255,255,.16);border-top-color:#38bdf8;border-radius:50%;animation:spin .85s linear infinite;margin:0 auto 16px}@keyframes spin{to{transform:rotate(360deg)}}.source{position:absolute;right:10px;bottom:10px;background:#000b;color:#dbeafe;padding:6px 9px;border-radius:999px;text-decoration:none;font-size:12px;border:1px solid #ffffff22}.front,.back{padding:22px;text-align:center}.front{color:var(--muted)}.back{display:none}.flipped .front{display:none}.flipped .back{display:block}.name{font-size:clamp(30px,5vw,52px);font-weight:900;line-height:1.05}.nick{font-size:clamp(20px,3vw,32px);color:var(--accent);margin:10px 0}.detail{color:#cbd5e1;font-size:17px}.buttons,.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}button{background:var(--panel2);color:white;border:1px solid var(--border);border-radius:12px;padding:13px 10px;font-weight:800;cursor:pointer;font-size:14px}button:active{transform:scale(.98)}.blue{background:var(--blue)}.red{background:var(--red)}.green{background:var(--green)}.yellow{background:var(--yellow)}textarea{display:none;width:100%;height:250px;background:#020617;color:white;border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:10px;font-family:Consolas,monospace}.note{color:#cbd5e1;border:1px dashed var(--border);border-radius:14px;padding:12px;margin-top:10px;line-height:1.45;background:#0f172aaa}@media(max-width:720px){body{padding:10px}.card{min-height:500px}.photo{height:340px}.buttons,.tools{grid-template-columns:1fr 1fr}.buttons button:nth-child(3){grid-column:span 2}}
</style></head><body><main class="app"><header><h1>US Helicopter Flash Cards <span style="font-size:12px;color:#38bdf8">v6</span></h1><div class="stats" id="stats"></div></header><section class="card" id="card"><div class="photo" id="photo"></div><div class="front">Tap the card or press Space to reveal the answer.</div><div class="back" id="back"></div></section><section class="buttons"><button id="prev">Previous</button><button class="blue" id="flip">Flip</button><button id="next">Next</button><button class="green" id="right">Right</button><button class="red" id="wrong">Wrong</button></section><section class="tools"><button class="yellow" id="shuffle">Shuffle Next</button><button id="newpic">Find New Photo</button><button id="preload">Preload Photos</button><button id="reset">Reset Score</button><button id="edit">Edit Deck</button></section><textarea id="editor"></textarea><div class="note"><strong>v6:</strong> US military and civilian helicopters only. Buttons are Right/Wrong. Score tracks right, wrong, and accuracy. Spinner-only loading. No helicopter name shown while loading.</div></main><script>

function safeJSON(value,fallback){try{return value?JSON.parse(value):fallback}catch{return fallback}}function saveCards(){localStorage.setItem(CARD_KEY,JSON.stringify(cards))}function saveImages(){localStorage.setItem(IMAGE_KEY,JSON.stringify(images))}function esc(value){return String(value??'').replace(/[&<>"']/g,(m)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function loadingMarkup(){return '<div><div class="spinner"></div><div>Loading photo...</div></div>'}function cardCorrect(card){return Number(card.correct||0)}function cardWrong(card){return Number(card.wrong||0)}function totalRight(){return cards.reduce((sum,c)=>sum+cardCorrect(c),0)}function totalWrong(){return cards.reduce((sum,c)=>sum+cardWrong(c),0)}function accuracy(){const r=totalRight(),w=totalWrong(),t=r+w;return t?Math.round((r/t)*100):0}function weight(card){return Math.max(1,2+cardWrong(card)*3-cardCorrect(card))}function weightedRandomIndex(){let total=cards.reduce((sum,card)=>sum+weight(card),0),pick=Math.random()*total;for(let i=0;i<cards.length;i++){pick-=weight(cards[i]);if(pick<=0)return i}return cards.length-1}function updateStats(){$('stats').innerHTML=`<span>Deck: ${cards.length}</span><span>Right: ${totalRight()}</span><span>Wrong: ${totalWrong()}</span><span>Accuracy: ${accuracy()}%</span>`}function render(){if(!cards.length)return;const card=cards[index];$('card').classList.toggle('flipped',flipped);renderImage(card);$('back').innerHTML=`<div class="name">${esc(card.manufacturer)} ${esc(card.model)}</div>${card.nickname?`<div class="nick">&quot;${esc(card.nickname)}&quot;</div>`:''}<div class="detail">${esc(card.country)} • ${esc(card.role)}</div>`;updateStats()}async function renderImage(card){const token=++requestToken,cached=images[card.id];if(cached&&cached.url){$('photo').innerHTML=`<img src="${esc(cached.url)}" alt="Helicopter photo"><a class="source" target="_blank" rel="noopener" href="${esc(cached.page)}">Wikimedia Commons</a>`;return}$('photo').innerHT
