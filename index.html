<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />

:root{--bg:#0f172a;--panel:#111827;--panel2:#1f2937;--text:#f8fafc;--muted:#94a3b8;--border:#334155;--blue:#0369a1;--red:#991b1b;--green:#166534;--yellow:#92400e;--accent:#38bdf8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#1e293b,var(--bg));color:var(--text);font-family:Arial,Helvetica,sans-serif}body{padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}.app{max-width:980px;margin:0 auto}header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}h1{font-size:22px;margin:8px 0}.stats{display:flex;gap:6px;flex-wrap:wrap}.stats span{border:1px solid var(--border);border-radius:999px;padding:6px 10px;color:#cbd5e1;background:#0f172acc;font-size:13px}.card{background:#111827dd;border:1px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:0 20px 60px #0008;cursor:pointer;min-height:590px}.photo{height:455px;background:#020617;display:flex;align-items:center;justify-content:center;position:relative;color:var(--muted);text-align:center;padding:20px;line-height:1.4}.photo img{width:100%;height:100%;object-fit:contain;display:block}.spinner{width:56px;height:56px;border:6px solid rgba(255,255,255,.15);border-top-color:#38bdf8;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}@keyframes spin{to{transform:rotate(360deg)}}.source{position:absolute;right:10px;bottom:10px;background:#000b;color:#dbeafe;padding:6px 9px;border-radius:999px;text-decoration:none;font-size:12px;border:1px solid #ffffff22}.front,.back{padding:22px;text-align:center}.front{color:var(--muted)}.back{display:none}.flipped .front{display:none}.flipped .back{display:block}.name{font-size:clamp(30px,5vw,52px);font-weight:900;line-height:1.05}.nick{font-size:clamp(20px,3vw,32px);color:var(--accent);margin:10px 0}.detail{color:#cbd5e1;font-size:17px}.buttons,.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}button{background:var(--panel2);color:white;border:1px solid var(--border);border-radius:12px;padding:13px 10px;font-weight:800;cursor:pointer;font-size:14px}button:active{transform:scale(.98)}.blue{background:var(--blue)}.red{background:var(--red)}.green{background:var(--green)}.yellow{background:var(--yellow)}textarea{display:none;width:100%;height:250px;background:#020617;color:white;border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:10px;font-family:Consolas,monospace}.note{color:#cbd5e1;border:1px dashed var(--border);border-radius:14px;padding:12px;margin-top:10px;line-height:1.45;background:#0f172aaa}@media(max-width:720px){body{padding:10px}.card{min-height:500px}.photo{height:340px}.buttons,.tools{grid-template-columns:1fr 1fr}.buttons button:nth-child(3){grid-column:span 2}}
</style>
</head>
<body>
<main class="app">
<header><h1>Helicopter Flash Cards</h1><div class="stats" id="stats"></div></header>
<section class="card" id="card" title="Tap to flip"><div class="photo" id="photo"></div><div class="front">Tap the card or press Space to reveal the answer.</div><div class="back" id="back"></div></section>
<section class="buttons"><button id="prev">Previous</button><button class="blue" id="flip">Flip</button><button id="next">Next</button><button class="red" id="practice">Need Practice</button><button class="green" id="know">Know It</button></section>
<section class="tools"><button class="yellow" id="shuffle">Shuffle Next</button><button id="newpic">Find New Photo</button><button id="preload">Preload Photos</button><button id="reset">Reset Progress</button><button id="edit">Edit Deck</button></section>
<textarea id="editor" spellcheck="false"></textarea>
<div class="note"><strong>Updated:</strong> loading screen now uses a spinner only, so the helicopter name is hidden until you flip the card.</div>
</main>

const CARD_KEY='helicopterFlashCards.hosted.cards.v2';
const IMAGE_KEY='helicopterFlashCards.hosted.images.v2';
let cards=safeJSON(localStorage.getItem(CARD_KEY),DEFAULT_CARDS),images=safeJSON(localStorage.getItem(IMAGE_KEY),{}),index=0,flipped=false,historyStack=[],requestToken=0;
const $=(id)=>document.getElementById(id);
function safeJSON(value,fallback){try{return value?JSON.parse(value):fallback}catch{return fallback}}
function saveCards(){localStorage.setItem(CARD_KEY,JSON.stringify(cards))}
function saveImages(){localStorage.setItem(IMAGE_KEY,JSON.stringify(images))}
function esc(value){return String(value??'').replace(/[&<>"']/g,(m)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function weight(card){return card.status==='practice'?5:card.status==='know'?1:2}
function weightedRandomIndex(){let total=cards.reduce((sum,card)=>sum+weight(card),0);let pick=Math.random()*total;for(let i=0;i<cards.length;i++){pick-=weight(cards[i]);if(pick<=0)return i}return cards.length-1}
function updateStats(){const know=cards.filter(c=>c.status==='know').length;const practice=cards.filter(c=>c.status==='practice').length;const learning=cards.length-know-practice;$('stats').innerHTML=`<span>Total: ${cards.length}</span><span>Know It: ${know}</span><span>Learning: ${learning}</span><span>Need Practice: ${practice}</span><span>Card ${index+1}/${cards.length}</span>`}
function loadingMarkup(){return '<div><div class="spinner"></div><div>Loading photo...</div></div>'}
function render(){if(!cards.length)return;const card=cards[index];$('card').classList.toggle('flipped',flipped);renderImage(card);$('back').innerHTML=`<div class="name">${esc(card.manufacturer)} ${esc(card.model)}</div>${card.nickname?`<div class="nick">&quot;${esc(card.nickname)}&quot;</div>`:''}<div class="detail">${esc(card.country)} • ${esc(card.role)}</div>`;updateStats()}
async function renderImage(card){const token=++requestToken;const cached=images[card.id];if(cached&&cached.url){$('photo').innerHTML=`<img src="${esc(cached.url)}" alt="Helicopter photo"><a class="source" target="_blank" rel="noopener" href="${esc(cached.page)}">Wikimedia Commons</a>`;return}$('photo').innerHTML=loadingMarkup();await findPhoto(card,0);if(token===requestToken&&cards[index]&&cards[index].id===card.id)renderImage(card)}
async function findPhoto(card,offset=0){const query=encodeURIComponent(card.photoQuery||`${card.manufacturer} ${card.model} helicopter`);const api=`https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=10&gsroffset=${offset}&gsrsearch=${query}&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=1400`;try{const response=await fetch(api,{mode:'cors'});const data=await response.json();const pages=Object.values(data.query?.pages||{}).filter(p=>p.imageinfo&&p.imageinfo[0]&&(p.imageinfo[0].thumburl||p.imageinfo[0].url));if(!pages.length)throw new Error('No images found');const preferred=pages.find(p=>!/logo|patch|emblem|badge|map|diagram|svg/i.test(p.title))||pages[0];const info=preferred.imageinfo[0];images[card.id]={url:info.thumburl||info.url,page:info.descriptionurl||'https://commons.wikimedia.org/',offset}}catch(error){images[card.id]={url:'',page:'',offset,error:String(error)};$('photo').innerHTML='No photo found yet.<br>Try Find New Photo.'}saveImages()}
function nextCard(){historyStack.push(index);index=weightedRandomIndex();flipped=false;render()}
function previousCard(){if(historyStack.length){index=historyStack.pop();flipped=false;render()}}
function mark(status){cards[index].status=status;saveCards();nextCard()}
$('card').addEventListener('click',()=>{flipped=!flipped;render()});$('flip').addEventListener('click',(e)=>{e.stopPropagation();flipped=!flipped;render()});$('next').addEventListener('click',nextCard);$('shuffle').addEventListener('click',nextCard);$('prev').addEventListener('click',previousCard);$('practice').addEventListener('click',()=>mark('practice'));$('know').addEventListener('click',()=>mark('know'));
$('newpic').addEventListener('click',async()=>{const card=cards[index];const oldOffset=images[card.id]?.offset||0;delete images[card.id];saveImages();$('photo').innerHTML=loadingMarkup();await findPhoto(card,oldOffset+10);render()});
$('preload').addEventListener('click',async()=>{for(let i=0;i<cards.length;i++){if(!images[cards[i].id]?.url){$('stats').innerHTML=`<span>Preloading ${i+1}/${cards.length}</span>`;await findPhoto(cards[i],0)}}render();alert('Photo preload complete.')});
$('reset').addEventListener('click',()=>{cards=cards.map(c=>({...c,status:'learning'}));saveCards();render()});
$('edit').addEventListener('click',()=>{const editor=$('editor');if(editor.style.display==='block'){try{cards=JSON.parse(editor.value);saveCards();index=0;historyStack=[];flipped=false;editor.style.display='none';render()}catch(error){alert('JSON error: '+error.message)}}else{editor.value=JSON.stringify(cards,null,2);editor.style.display='block'}});
document.addEventListener('keydown',(e)=>{if(e.target.id==='editor')return;if(e.code==='Space'){e.preventDefault();flipped=!flipped;render()}if(e.key==='ArrowRight')nextCard();if(e.key==='ArrowLeft')previousCard();if(e.key.toLowerCase()==='n')mark('practice');if(e.key.toLowerCase()==='k')mark('know')});
render();
