let cards=safeJSON(localStorage.getItem(CARD_KEY),DEFAULT_CARDS), images=safeJSON(localStorage.getItem(IMAGE_KEY),{}), order=safeJSON(localStorage.getItem(ORDER_KEY),DEFAULT_CARDS.map((_,i)=>i)), position=Number(localStorage.getItem(POS_KEY)||0), flipped=false, requestToken=0;
const $=id=>document.getElementById(id);
function safeJSON(v,f){try{return v?JSON.parse(v):f}catch{return f}}function saveCards(){localStorage.setItem(CARD_KEY,JSON.stringify(cards))}function saveImages(){localStorage.setItem(IMAGE_KEY,JSON.stringify(images))}function saveRound(){localStorage.setItem(ORDER_KEY,JSON.stringify(order));localStorage.setItem(POS_KEY,String(position))}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function loadingMarkup(){return '<div><div class="spinner"></div><div>Loading photo...</div></div>'}function currentIndex(){if(position>=order.length)position=order.length-1;if(position<0)position=0;return order[position]}function currentCard(){return cards[currentIndex()]}function totalRight(){return cards.reduce((s,c)=>s+Number(c.correct||0),0)}function totalWrong(){return cards.reduce((s,c)=>s+Number(c.wrong||0),0)}function accuracy(){const r=totalRight(),w=totalWrong(),t=r+w;return t?Math.round(r/t*100):0}function updateStats(){$('stats').innerHTML='<span>Card: '+Math.min(position+1,order.length)+'/'+order.length+'</span><span>Right: '+totalRight()+'</span><span>Wrong: '+totalWrong()+'</span><span>Accuracy: '+accuracy()+'%</span>'}
function cleanStoredDataIfNeeded(){const ids=new Set(cards.map(c=>c.id)); order=order.filter(i=>cards[i]); if(order.length!==cards.length || new Set(order).size!==order.length){order=cards.map((_,i)=>i);position=0;saveRound()} for(const k of Object.keys(images)){if(!ids.has(k))delete images[k]} saveImages()}
function ensurePhotoState(card){if(!images[card.id])images[card.id]={photos:[],photoIndex:0,nextOffset:0}; if(!Array.isArray(images[card.id].photos))images[card.id]={photos:images[card.id].url?[{url:images[card.id].url,page:images[card.id].page||''}]:[],photoIndex:0,nextOffset:images[card.id].offset||0}; return images[card.id]}
function overlayArrows(){return '<button class="photo-arrow left" id="photoPrev">‹</button><button class="photo-arrow right" id="photoNext">›</button>'}function attachPhotoArrows(){const l=$('photoPrev'),r=$('photoNext');if(l)l.onclick=e=>{e.preventDefault();e.stopPropagation();previousPhoto()};if(r)r.onclick=e=>{e.preventDefault();e.stopPropagation();nextPhoto()}}
function render(){if(!cards.length)return;if(position>=order.length){position=order.length-1;saveRound()}const card=currentCard();$('card').classList.toggle('flipped',flipped);renderImage(card);$('back').innerHTML='<div class="name">'+esc(card.manufacturer)+' '+esc(card.model)+'</div>'+(card.nickname?'<div class="nick">&quot;'+esc(card.nickname)+'&quot;</div>':'')+'<div class="detail">'+esc(card.country)+' • '+esc(card.role)+'</div>';updateStats()}
async function renderImage(card){const token=++requestToken,st=ensurePhotoState(card),p=st.photos[st.photoIndex];if(p&&p.url){$('photo').innerHTML='<img src="'+esc(p.url)+'" alt="Helicopter photo">'+overlayArrows()+'<a class="source" target="_blank" rel="noopener" href="'+esc(p.page)+'">Wikimedia Commons</a>';attachPhotoArrows();return}$('photo').innerHTML=loadingMarkup();await fetchPhoto(card,st.nextOffset||0);if(token===requestToken)renderImage(card)}
async function fetchPhoto(card,offset){const st=ensurePhotoState(card),query=encodeURIComponent(card.photoQuery||card.manufacturer+' '+card.model+' helicopter'),api='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=10&gsroffset='+offset+'&gsrsearch='+query+'&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=1400';try{const response=await fetch(api,{mode:'cors',cache:'no-store'}),data=await response.json(),pages=Object.values(data.query?.pages||{}).filter(p=>p.imageinfo&&p.imageinfo[0]&&(p.imageinfo[0].thumburl||p.imageinfo[0].url)).filter(p=>!/logo|patch|emblem|badge|map|diagram|svg/i.test(p.title));if(!pages.length)throw new Error('No images found');const existing=new Set(st.photos.map(p=>p.url));for(const page of pages){const info=page.imageinfo[0],url=info.thumburl||info.url;if(!existing.has(url))st.photos.push({url,page:info.descriptionurl||'https://commons.wikimedia.org/'})}st.nextOffset=offset+10;if(st.photoIndex>=st.photos.length)st.photoIndex=Math.max(0,st.photos.length-1)}catch(err){$('photo').innerHTML='No photo found yet.'}saveImages()}
async function nextPhoto(){const card=currentCard(),st=ensurePhotoState(card);if(st.photoIndex<st.photos.length-1){st.photoIndex++;saveImages();renderImage(card);return}$('photo').innerHTML=loadingMarkup();await fetchPhoto(card,st.nextOffset||10);if(st.photoIndex<st.photos.length-1)st.photoIndex++;saveImages();renderImage(card)}function previousPhoto(){const card=currentCard(),st=ensurePhotoState(card);if(st.photoIndex>0){st.photoIndex--;saveImages();renderImage(card)}}
function nextCard(){if(position<order.length-1){position++;flipped=false;saveRound();render()}else{flipped=false;updateStats();$('photo').innerHTML='<div>Round complete.<br>Tap Reset / Shuffle New Round.</div>';$('back').innerHTML='';$('card').classList.remove('flipped')}}function mark(result){const c=currentCard();if(result==='right')c.correct=Number(c.correct||0)+1;else c.wrong=Number(c.wrong||0)+1;saveCards();nextCard()}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function resetRound(){order=shuffle(cards.map((_,i)=>i));position=0;flipped=false;saveRound();render()}
$('frontReveal').onclick=()=>{flipped=true;render()};$('back').onclick=()=>{flipped=false;render()};$('next').onclick=nextCard;$('right').onclick=()=>mark('right');$('wrong').onclick=()=>mark('wrong');$('reset').onclick=resetRound;$('preload').onclick=async()=>{for(let i=0;i<cards.length;i++){const st=ensurePhotoState(cards[i]);if(!st.photos.length){$('stats').innerHTML='<span>Preloading '+(i+1)+'/'+cards.length+'</span>';await fetchPhoto(cards[i],0)}}render();alert('Photo preload complete.')};$('edit').onclick=()=>{const ed=$('editor');if(ed.style.display==='block'){try{cards=JSON.parse(ed.value);saveCards();order=cards.map((_,i)=>i);position=0;saveRound();ed.style.display='none';render()}catch(e){alert('JSON error: '+e.message)}}else{ed.value=JSON.stringify(cards,null,2);ed.style.display='block'}};document.addEventListener('keydown',e=>{if(e.target.id==='editor')return;if(e.code==='Space'){e.preventDefault();flipped=!flipped;render()}if(e.key==='ArrowRight')nextCard();if(e.key.toLowerCase()==='r')mark('right');if(e.key.toLowerCase()==='w')mark('wrong')});cleanStoredDataIfNeeded();render();
</script></body></html>
